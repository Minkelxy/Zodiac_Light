[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
lib_deps = fastled/FastLED@3.10.3
monitor_speed = 460800
build_flags =
    -D CLP_DATA_PIN=18
    -D CLP_BAUD=460800
    -D CLP_CURRENT_LIMIT_MA=2000

; The default is the PC streaming receiver. Flashing is an explicit user action.
[env:esp32dev]
build_flags = ${env.build_flags} -D CLP_MODE=0

; Low-brightness, compile-selected wiring checks; never a stream-loss fallback.
[env:local_chase]
build_flags = ${env.build_flags} -D CLP_MODE=1

[env:local_rgb]
build_flags = ${env.build_flags} -D CLP_MODE=2

[env:local_parts]
build_flags = ${env.build_flags} -D CLP_MODE=3
