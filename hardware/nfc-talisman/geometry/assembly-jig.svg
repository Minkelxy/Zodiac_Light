<text x="142" y="81" font-family="Microsoft YaHei,Arial,sans-serif" font-size="3" fill="#28252b" text-anchor="middle">总高 8 · 底厚 2 · 口袋深 6</text>
<text x="142" y="90" font-family="Microsoft YaHei,Arial,sans-serif" font-size="3" fill="#28252b" text-anchor="middle">37 mm 板单边名义间隙 0.2</text>
<text x="142" y="99" font-family="Microsoft YaHei,Arial,sans-serif" font-size="3" fill="#28252b" text-anchor="middle">胶合时使用平压板，均匀轻压外围</text>
<text x="10" y="117" font-family="Microsoft YaHei,Arial,sans-serif" font-size="3" fill="#28252b" text-anchor="start">建议：PLA / PETG；层高 0.2 mm；无需金属定位件。</text>
<text x="10" y="125" font-family="Microsoft YaHei,Arial,sans-serif" font-size="3" fill="#28252b" text-anchor="start">先放单片检查松紧和基准平边，再试叠装；取件口底部保留 2 mm 底板。</text>
<text x="10" y="133" font-family="Microsoft YaHei,Arial,sans-serif" font-size="3" fill="#28252b" text-anchor="start">assembly-jig.scad 包含夹具和独立 37 mm 压板；STL 导出前核验打印机尺寸。</text>
<text x="10" y="141" font-family="Microsoft YaHei,Arial,sans-serif" font-size="3" fill="#6e6b65" text-anchor="start">辅助夹具未实物打印，尺寸与装配间隙尚未实测。</text>
