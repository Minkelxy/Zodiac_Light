<text x="60" y="887" class="small">VCC ties directly to VOUT. C1 is the entire bypass total; do not add another supply capacitor.</text>
<text x="60" y="911" class="small">CT1 is an initial tuning value. Four LEDs may dim at low NFC field; assess full stack resonance and read/write under load.</text>
<text x="60" y="935" class="small">A/K identify LED polarity; map actual EasyEDA library pad numbers before manufacture. This SVG is not a native EDA schematic.</text>
