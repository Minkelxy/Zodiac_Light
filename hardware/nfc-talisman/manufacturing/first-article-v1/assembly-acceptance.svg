<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 1188 840"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#18212f}.title{font-size:27px;font-weight:700}.head{font-size:19px;font-weight:700}.body{font-size:15px}.small{font-size:12px}.dim{stroke:#334155;stroke-width:1.5;marker-start:url(#arr);marker-end:url(#arr)}.guide{stroke:#64748b;stroke-width:1;stroke-dasharray:5 4}</style></defs><rect width="1188" height="840" fill="#fff"/>
<text x="42" y="48" class="title">NFC 五层装配参考 · FIRST ARTICLE · 未经实物验证</text><text x="42" y="73" class="small">离线试装说明，不替代制造图/CAD；所有图案按外侧观察。不得新增挂孔或定位孔。</text>
<text x="52" y="120" class="head">叠层顺序（从马面外侧向射手座外侧）</text>
<g stroke="#334155" stroke-width="2"><path d="M74 148 h64 v42 H74z" fill="#d9c7f2"/><path d="M74 210 h64 v42 H74z" fill="#eee9f5"/><path d="M74 272 h64 v42 H74z" fill="#c8d8e5"/><path d="M74 334 h64 v42 H74z" fill="#eee9f5"/><path d="M74 396 h64 v42 H74z" fill="#decf98"/></g>
<g class="body"><text x="160" y="166">L1 外盖：马面朝外 ↑</text><text x="160" y="186" class="small">图案面朝外；Top 面</text><text x="160" y="228">L2 垫环：30 mm 内窗</text><text x="160" y="290">L3 核心板：Top 朝马面</text><text x="160" y="352">L4 垫环：30 mm 内窗</text><text x="160" y="414">L5 外盖：射手座面朝外 ↓</text><text x="160" y="434" class="small">底面外侧方向向下；不额外镜像图案</text></g>
<path d="M46 150 V434" stroke="#334155" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="34" y="452" class="small">层序示意</text><text x="52" y="488" class="small">每片双层 FR-4，板厚约 1 mm；总叠层约 5 mm + 实际胶层（待量）</text>
<text x="595" y="120" class="head">规则八边形平面与胶环示意</text><path d="M901.00,252.02 L835.98,187.00 L744.02,187.00 L679.00,252.02 L679.00,343.98 L744.02,409.00 L835.98,409.00 L901.00,343.98 Z" fill="#c7d2de" fill-rule="evenodd" opacity=".6" stroke="#243447" stroke-width="2"/><path d="M880.00,260.72 L827.28,208.00 L752.72,208.00 L700.00,260.72 L700.00,335.28 L752.72,388.00 L827.28,388.00 L880.00,335.28 Z" fill="#fff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="790" y="294" text-anchor="middle" class="body">30 mm 内窗</text><text x="790" y="315" text-anchor="middle" class="small">环带宽 3.5 mm</text>
<line x1="679" y1="144" x2="901" y2="144" class="dim"/><line x1="679" y1="150" x2="679" y2="170" class="guide"/><line x1="901" y1="150" x2="901" y2="170" class="guide"/><text x="790" y="138" text-anchor="middle" class="small">外形对边 37 mm</text><line x1="700" y1="174" x2="880" y2="174" class="dim"/><text x="790" y="169" text-anchor="middle" class="small">内窗对边 30 mm</text>
<text x="955" y="205" class="body">环带仅为胶区位置示意</text><text x="955" y="228" class="small">胶落垫环外围实材</text><text x="955" y="248" class="small">禁止流入开窗/星孔/槽</text><text x="955" y="282" class="small">夹具口袋对边 37.4 mm</text><text x="955" y="302" class="small">先做单片试配，不能假设适配</text>
<text x="52" y="540" class="head">装配和验收要点</text><text x="52" y="568" class="body">1. 先放 L5（图案朝下），再放 L4、L3（Top 朝马面）、L2、L1（马面朝上）；同一平边对齐。</text><text x="52" y="595" class="body">2. 先完成干装验收，确认器件净高、内窗/光槽遮挡、对齐及 NFC；通过后才可胶合。</text><text x="52" y="622" class="body">3. 胶型、胶层厚度与固化条件要实测记录；胶合后重新复查 RF/NDEF、VOUT 和两面光效。</text><text x="52" y="649" class="body">4. TP1=VOUT，TP2=GND：相对核心板中心坐标 (+2.032,+2.921) mm、(+5.969,+2.921) mm；均为无孔焊盘。</text><text x="52" y="676" class="body">5. 暗场下马形与八星可辨认；允许扫描时闪烁。默认先 B4/S4，失败再试 B2/S2 或无负载诊断。</text><text x="52" y="703" class="body">6. 不设臆造读距、VOUT 或绝对亮度阈值；记录用户目标、测量条件、结果和证据。</text>
<rect x="42" y="735" width="1104" height="66" rx="8" fill="#fff7e6" stroke="#c78b24"/><text x="58" y="762" class="body" font-weight="700">当前状态：未制造、未实物试装、未供应商 CAM 审查；图示不构成生产放行。</text><text x="58" y="784" class="small">尺寸/坐标来源：geometry/assembly-notes.md、electrical/assembly.md、manufacturing/draft/star-face-audit.json。</text></svg>